services:
  uimanager01:
    image: monitoruimanager:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:7007:7007
    container_name: monitoruimanager01
    networks:
      cassandra_net:
        ipv4_address: 172.30.0.20

    restart: always
    environment:
    - MONITOR_TLS_CERTPATH=server.crt
    - MONITOR_TLS_KEYPATH=server.key
    - MONITOR_TLS_KEYPASSWORD=
    - MONITOR_TLS_CAPATH=rootCA.crt

    - MONITOR_UIMANAGER_MODULEID=623a57c2-3df5-4287-ada5-82f7e4a0b5db
    - MONITOR_UIMANAGER_SPACEID ID=17f0bd20-41cf-4801-a481-ff721a41fa93
    - MONITOR_UIMANAGER_DATAMANAGERURL=https://172.30.0.10:6006,https://172.30.0.11:6006

    - MONITOR_HTTP_HOST=0.0.0.0
    - MONITOR_HTTP_PORT=7007
    - MONITOR_HTTP_READTIMEOUT=30
    - MONITOR_HTTP_WRITETIMEOUT=30
    - MONITOR_HTTP_RL=100
    - MONITOR_HTTP_TLS=false
    - MONITOR_HTTP_TLS_SKIPVERIFY=true
    - MONITOR_HTTP_TRUSTPROXY=true

    - MONITOR_DB_HOST=172.30.0.2:9042,172.30.0.3:9042,172.30.0.4:9042
    - MONITOR_DB_USERNAME=monitor
    - MONITOR_DB_PASSWORD=
    - MONITOR_DB_TLS=true
    - MONITOR_DB_TLS_SKIPVERIFY=true
    - MONITOR_DB_KEYSPACE=monitor
    - MONITOR_DB_CONSISTENCY=One
    - MONITOR_DB_CONSISTENCYREAD=One
    - MONITOR_DB_TIMEOUT=30000

    - MONITOR_JWT_SECRET=
    - MONITOR_JWT_ALLOW_INSECURE_HTTP=false
networks:
  cassandra_net:
    name: cassandra_net
    external: true
